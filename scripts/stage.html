<!doctype html><html><head><meta charset='utf-8'><title>predigest stage</title><style>html,body{margin:0;height:100%;background:radial-gradient(circle at 0% 0%,#1e1f23 0%,#0c0c0e 55%,#000 100%) fixed;overflow:hidden}#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:700 22vw "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-0.02em}html.day,html.day body{background:radial-gradient(circle at 100% 0%,#ffffff 0%,#f2f3f5 55%,#e3e5e9 100%) fixed!important}html.day #w{color:#111}</style><script>(function(){function isDay(d){var h=d.getHours();return h>=7&&h<19;}window.DAY=isDay(new Date())||/[?&]day/.test(location.search);if(window.DAY)document.documentElement.className='day';})();</script></head><body><div id='w'></div><script>var el=document.getElementById('w'),run=0;function go(){var h=location.hash.slice(1);if(!h)return;var q={};h.split('&').forEach(function(p){var k=p.split('=');q[k[0]]=decodeURIComponent(k[1]||'');});var T=+q.t,D=+q.d,W=q.w.split(' '),n=W.length,id=++run,lead=0.12;var P=W.map(function(w,i){return i==n-1?0:(/[.!?]$/.test(w)?0.45:(/[,;:]$/.test(w)?0.25:0));});var ps=P.reduce(function(a,b){return a+b;},0),K=W.map(function(w){return w.replace(/[^A-Za-z0-9]/g,'').length+2;}),ks=K.reduce(function(a,b){return a+b;},0);var avail=D-lead-ps-0.1,S=[],t=lead;for(var i=0;i<n;i++){S.push(t);t+=K[i]/ks*avail+P[i];}var cur=-1;function tick(){if(id!==run)return;var now=(Date.now()-T)/1000,i=-1;for(var j=0;j<n;j++){if(now>=S[j])i=j;}if(now>D+0.8)i=-2;if(i!==cur){cur=i;var w=i>=0?W[i]:'';el.textContent=w;el.style.fontSize=Math.min(22,150/Math.max(w.length,1))+'vw';}if(i!==-2)requestAnimationFrame(tick);}requestAnimationFrame(tick);}window.addEventListener('hashchange',go);go();</script></body></html>
