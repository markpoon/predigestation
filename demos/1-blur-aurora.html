<!doctype html><html><head><meta charset='utf-8'><title>measuring</title><style>html,body{margin:0;height:100%;background:#05060a;overflow:hidden}.b{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(90px);opacity:.75;mix-blend-mode:screen}.b1{background:#00d1b2;left:-10vw;top:-15vw;animation:d1 18s ease-in-out infinite alternate}.b2{background:#6c3cff;right:-12vw;top:5vw;animation:d2 22s ease-in-out infinite alternate}.b3{background:#ff3d9a;left:20vw;bottom:-25vw;animation:d3 26s ease-in-out infinite alternate}.b4{background:#1f6feb;right:10vw;bottom:-20vw;animation:d1 30s ease-in-out infinite alternate-reverse}@keyframes d1{to{transform:translate(25vw,15vw) scale(1.2)}}@keyframes d2{to{transform:translate(-30vw,20vw) scale(.9)}}@keyframes d3{to{transform:translate(10vw,-30vw) scale(1.15)}}h1{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;color:#fff;font:700 14vw 'Helvetica Neue',Helvetica,sans-serif;letter-spacing:-.03em;opacity:0;animation:in 2s ease .5s forwards}@keyframes in{to{opacity:1}}.tag{position:absolute;left:3vw;bottom:3vh;color:rgba(255,255,255,.6);font:500 1.6vw 'Helvetica Neue',Helvetica,sans-serif}</style></head><body><div class='b b1'></div><div class='b b2'></div><div class='b b3'></div><div class='b b4'></div><h1>Aurora</h1><div class='tag'>1 / Heavy blur</div><script>var f=0,s=performance.now(),a=[];function t(n){f++;if(n-s>=1000){a.push(f);f=0;s=n;var v=a.slice(1);if(v.length){document.title='fps avg '+Math.round(v.reduce(function(x,y){return x+y;},0)/v.length)+' min '+Math.min.apply(null,v);}}requestAnimationFrame(t);}requestAnimationFrame(t);</script></body></html>
