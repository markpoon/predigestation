<!doctype html><html><head><meta charset='utf-8'><title>measuring</title><style>html,body{margin:0;height:100%;background:#05060a;overflow:hidden}.b{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(90px);opacity:.75;mix-blend-mode:screen}.b1{background:#00d1b2;left:-10vw;top:-15vw;animation:d1 18s ease-in-out infinite alternate}.b2{background:#6c3cff;right:-12vw;top:5vw;animation:d2 22s ease-in-out infinite alternate}.b3{background:#ff3d9a;left:20vw;bottom:-25vw;animation:d3 26s ease-in-out infinite alternate}.b4{background:#1f6feb;right:10vw;bottom:-20vw;animation:d1 30s ease-in-out infinite alternate-reverse}@keyframes d1{to{transform:translate(25vw,15vw) scale(1.2)}}@keyframes d2{to{transform:translate(-30vw,20vw) scale(.9)}}@keyframes d3{to{transform:translate(10vw,-30vw) scale(1.15)}}h1{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;color:#fff;font:700 14vw 'Helvetica Neue',Helvetica,sans-serif;letter-spacing:-.03em;opacity:0;animation:in 2s ease .5s forwards}@keyframes in{to{opacity:1}}.tag{position:absolute;left:3vw;bottom:3vh;color:rgba(255,255,255,.6);font:500 1.6vw 'Helvetica Neue',Helvetica,sans-serif}#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:700 22vw 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-0.02em;text-shadow:0 0 40px rgba(0,0,0,.35)}</style></head><body><div class='b b1'></div><div class='b b2'></div><div class='b b3'></div><div class='b b4'></div><div id='w'></div><script>var el=document.getElementById('w'),run=0;function go(){var h=location.hash.slice(1);if(!h)return;var q={};h.split('&').forEach(function(p){var k=p.split('=');q[k[0]]=decodeURIComponent(k[1]||'');});var T=+q.t,D=+q.d,W=q.w.split(' '),n=W.length,id=++run,lead=0.12;var P=W.map(function(w,i){return i==n-1?0:(/[.!?]$/.test(w)?0.45:(/[,;:]$/.test(w)?0.25:0));});var ps=P.reduce(function(a,b){return a+b;},0),K=W.map(function(w){return w.replace(/[^A-Za-z0-9]/g,'').length+2;}),ks=K.reduce(function(a,b){return a+b;},0);var avail=D-lead-ps-0.1,S=[],t=lead;for(var i=0;i<n;i++){S.push(t);t+=K[i]/ks*avail+P[i];}var cur=-1;function tick(){if(id!==run)return;var now=(Date.now()-T)/1000,i=-1;for(var j=0;j<n;j++){if(now>=S[j])i=j;}if(now>D+0.8)i=-2;if(i!==cur){cur=i;var w=i>=0?W[i]:'';el.textContent=w;el.style.fontSize=Math.min(22,150/Math.max(w.length,1))+'vw';}if(i!==-2)requestAnimationFrame(tick);}requestAnimationFrame(tick);}window.addEventListener('hashchange',go);go();</script><div class='tag'>1 / Heavy blur</div><script>var f=0,s=performance.now(),a=[];function t(n){f++;if(n-s>=1000){a.push(f);f=0;s=n;var v=a.slice(1);if(v.length){document.title='fps avg '+Math.round(v.reduce(function(x,y){return x+y;},0)/v.length)+' min '+Math.min.apply(null,v);}}requestAnimationFrame(t);}requestAnimationFrame(t);</script></body></html>
